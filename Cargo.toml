[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["razed <razed.production@yandex.ru>"]
repository = "https://github.com/razedproduction/pragma.component-ecs"
keywords = ["gamedev", "ecs", "entity", "component", "pragma"]
categories = ["game-development", "data-structures", "concurrency"]

[workspace.dependencies]
# Internal crates: exact versions (lockstep), as in pragma.core (DECISIONS.md #4).
pragma_ecs = { path = "crates/pragma_ecs", version = "=0.1.0" }

# The runtime core this component is built on (DECISIONS.md #2).
pragma_core = { version = "1.0.0", default-features = false }

# External - pure Rust only (deny.toml).
thiserror = "2.0.21"

# Dev / verification.
proptest = "1.12.0"
criterion = "0.8.2"

[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "warn"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
arithmetic_side_effects = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
