# TEMP: Linux diagnostics for change/mut_write_all (PR #9). Never merged.
name: linux-diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - name: environment
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|L1d|L2|L3' || true
          ldd --version | head -1
      - name: build
        run: |
          git worktree add --detach ../main origin/main
          git worktree add --detach ../base origin/tmp/lx-base
          (cd ../main && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../tm cargo bench -p pragma_ecs --bench change --bench query --no-run)
          (cd ../base && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../tb cargo bench -p pragma_ecs --bench change --bench query --no-run)
          CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../th cargo bench -p pragma_ecs --bench change --bench query --no-run
      - name: interleaved runs
        run: |
          exe() { ls "$1"/release/deps/$2-* | grep -v '\.d$' | head -1; }
          run() { # label target-dir offset
            if [ "$3" = "-" ]; then unset PRAGMA_XL_OFF; else export PRAGMA_XL_OFF=$3; fi
            "$(exe $2 change)" --bench --warm-up-time 1 --measurement-time 3 --noplot 'change/mut' 2>/dev/null \
              | grep -E 'time:   \[[0-9]' | awk -v l="$1" '{print "RES", l, NR==1?"mut_read_only":"mut_write_all", $4}'
            "$(exe $2 query)" --bench --warm-up-time 1 --measurement-time 3 --noplot 'query_iter/(vec|query_8_tables)/' 2>/dev/null \
              | grep -E 'time:   \[[0-9]' | awk -v l="$1" '{print "RES", l, NR==1?"vec":"query_8_tables", $4}'
            unset PRAGMA_XL_OFF
          }
          for r in 1 2 3; do
            run "main" ../tm -
            run "c209b4d" ../tb -
            run "head" ../th -
            run "head-plain" ../th plain
          done
