# TEMP: Linux diagnostics for change/mut_write_all (PR #9). Never merged.
name: linux-diag

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - name: environment
        run: lscpu | grep -E 'Model name' || true
      - name: build
        run: |
          for side in main:origin/main c209b4d:origin/tmp/lx-base0 da269fd:origin/patch-query-iter; do
            name=${side%%:*}; rev=${side#*:}
            git worktree add --detach ../$name $rev
            (cd ../$name && CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-$name cargo bench -p pragma_ecs --bench change --no-run)
            (cd ../$name && RUSTFLAGS="-C llvm-args=-align-loops=64" CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../a-$name cargo bench -p pragma_ecs --bench change --no-run)
          done
      - name: interleaved runs
        run: |
          exe() { ls "$1"/release/deps/change-* | grep -v '\.d$' | head -1; }
          for r in 1 2 3; do
            for d in t-main t-c209b4d t-da269fd a-main a-c209b4d a-da269fd; do
              "$(exe ../$d)" --bench --warm-up-time 1 --measurement-time 3 --noplot 'change/mut' 2>/dev/null \
                | grep -E 'time:   \[[0-9]' | awk -v l="$d" '{print "RES", l, NR==1?"mut_read_only":"mut_write_all", $4}'
            done
          done
