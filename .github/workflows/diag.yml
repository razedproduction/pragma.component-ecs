# TEMP: Linux diagnostics for commands/spawn_commands (PR #11). Never merged.
name: linux-diag-spawn

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - name: environment
        run: lscpu | grep -E 'Model name|^CPU\(s\)' || true
      - name: build
        run: |
          for side in main:origin/main rel:origin/release-1.0.1; do
            name=${side%%:*}; rev=${side#*:}
            git worktree add --detach ../$name $rev
            (cd ../$name && RUSTFLAGS="-C llvm-args=-align-loops=64" CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t-$name cargo bench -p pragma_ecs --bench commands --no-run)
          done
      - name: interleaved runs
        run: |
          exe() { ls "$1"/release/deps/commands-* | grep -v '\.d$' | head -1; }
          for r in 1 2 3 4 5; do
            for env in default arena1; do
              for name in main rel; do
                if [ $env = arena1 ]; then export MALLOC_ARENA_MAX=1; else unset MALLOC_ARENA_MAX; fi
                "$(exe ../t-$name)" --bench --warm-up-time 1 --measurement-time 3 --noplot 'commands/spawn_(bundle_)?commands' 2>/dev/null \
                  | awk -v l="$name-$env" '/^commands\//{b=$1} /time:   \[[0-9]/{print "RES", l, b, $4, $5}'
                unset MALLOC_ARENA_MAX
              done
            done
          done
