# TEMP: Linux diagnostics for commands/spawn_bundle_commands thread placement (PR #11). Never merged.
name: linux-diag-placement

on:
  pull_request:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - name: environment
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread\(s\) per core' || true
          lscpu -e || true
          for c in /sys/devices/system/cpu/cpu[0-9]*; do echo "$c siblings $(cat $c/topology/thread_siblings_list)"; done
      - name: build
        run: |
          git worktree add --detach ../rel origin/release-1.0.1
          (cd ../rel && RUSTFLAGS="-C llvm-args=-align-loops=64" CARGO_TARGET_DIR=$GITHUB_WORKSPACE/../t cargo bench -p pragma_ecs --bench commands --no-run)
      - name: aslr runs
        run: |
          export MALLOC_ARENA_MAX=1
          EXE=$(ls ../t/release/deps/commands-* | grep -v '\.d$' | head -1)
          A=$(uname -m)
          one() { # label prefix...
            l=$1; shift
            "$@" "$EXE" --bench --warm-up-time 1 --measurement-time 2 --noplot '^commands/spawn_bundle_direct/10000$' 2>/dev/null \
              | awk -v l="$l" '/time:   \[[0-9]/{print "RES", l, "spawn_bundle_direct", $4, $5}'
          }
          for r in 1 2 3 4 5 6; do one aslr-on env; one aslr-off setarch $A -R; done
          for pad in 0 256 512 768 1024 1280 1536 1792 2048 2304 2560 2816 3072 3328 3584 3840; do
            P=$(head -c $pad /dev/zero | tr '\0' 'x')
            for r in 1 2; do one "pad$pad" env PAD="$P" setarch $A -R; done
          done