name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Does the PR touch anything besides Markdown and docs/? If not, the heavy jobs (fuzz,
  # semver-checks, bench gate, baseline build) are skipped (DECISIONS #32, as pragma.core #45).
  # A skipped job counts as passed for required checks, unlike a workflow-level `paths-ignore`,
  # which never reports. Pushes to main always run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A hung test must fail fast rather than hang for the default 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
      # The mandatory determinism suite (M5, DECISIONS #29): every scenario on 1, 2 and N
      # workers, checked against the committed golden hashes (examples/ecs_sim/golden.txt) on
      # both platforms. The same scenarios, capped in size, run in debug as ecs_sim's tests.
      - run: cargo run -p ecs_sim --release -- --suite --ticks 200

  fuzz:
    name: fuzz (${{ matrix.target }}, 60 s)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [world_ops, commands, change_ticks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # A separate `fuzz/` workspace (libFuzzer is C++, DECISIONS #30). The target is explicit: the
      # prebuilt cargo-fuzz binary is built for musl and defaults to its own platform, while ASan
      # is incompatible with musl's static libc.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60
        env:
          RUSTFLAGS: ""

  baseline:
    name: baseline benches build (hecs, bevy_ecs)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: baseline
      # A separate workspace (DECISIONS #31): only kept compiling here; the nightly workflow runs it.
      - run: cargo bench --manifest-path baseline/Cargo.toml --bench baseline --no-run

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Purity, layers & unsafe budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      # The unsafe counter (layers.toml [unsafe_budget]): in a PR, budget growth is checked against the
      # base revision and requires a new DECISIONS.md entry.
      - name: audit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "${{ github.event.pull_request.base.sha }}:layers.toml" > "$RUNNER_TEMP/base-layers.toml"
            python tools/audit_workspace.py . "--unsafe-baseline=$RUNNER_TEMP/base-layers.toml"
          else
            python tools/audit_workspace.py .
          fi

  semver:
    name: semver-checks (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # The baseline is main, not a tag (DECISIONS #33): a breaking public API change without a
      # version bump fails the PR. The package is named: `--workspace` would also pick the
      # unpublished example, and skipped `pragma_ecs` itself while it was `publish = false` (before 1.0). A short target directory: semver-checks nests the baseline's
      # build several levels deep (`target/semver-checks/git-<sha>/local-…/target/debug/build/…`),
      # which exceeds MAX_PATH on Windows (LNK1104).
      - run: cargo semver-checks -p pragma_ecs --baseline-rev ${{ github.event.pull_request.base.sha }}
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/sc

  bench:
    name: bench gate (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate
      # Interleaved A/B of the PR base ↔ head on one runner (DECISIONS #32): a regression > 10%
      # beyond the reference shift (a plain Vec, sequential queries, direct world operations)
      # fails the PR.
      - name: bench gate
        shell: bash
        run: |
          git worktree add --detach ../bench-base "${{ github.event.pull_request.base.sha }}"
          python tools/bench_gate.py --base ../bench-base --head . --rounds 3 --summary "$GITHUB_STEP_SUMMARY"
